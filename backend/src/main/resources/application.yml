spring:
  application:
    name: fipe-explorer-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fipe_explorer}
    username: ${DB_USER:fipe}
    password: ${DB_PASSWORD:fipe}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  flyway:
    enabled: true

fipe:
  import:
    csv-path: ${FIPE_CSV_PATH:../data/tabela-fipe-336.csv}
    incoming-dir: ${FIPE_IMPORT_INCOMING_DIR:../data/incoming}
    processed-dir: ${FIPE_IMPORT_PROCESSED_DIR:../data/processed}
    schedule:
      # Segundo Spring (6 campos): seg min hora dia-do-mês mês dia-da-semana. Default: dia 1, 3h.
      cron: ${FIPE_IMPORT_SCHEDULE_CRON:0 0 3 1 * *}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  external-api:
    base-url: ${FIPE_EXTERNAL_API_BASE_URL:https://fipe.parallelum.com.br/api/v2}
    token: ${FIPE_EXTERNAL_API_TOKEN:}
    cache-ttl-hours: ${FIPE_EXTERNAL_API_CACHE_TTL_HOURS:24}
  jwt:
    # Default só serve para desenvolvimento local — em produção, SEMPRE sobrescrever via JWT_SECRET.
    secret: ${JWT_SECRET:xuuMCZakUvLTz71IR+pD0X4wKOaukd5vZt9Ar21FIWhXv+ZP9X7OUcHWxh92XtBteDHS1mgg7T2gUhxQ3vcwZQ==}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

server:
  port: ${SERVER_PORT:8080}
